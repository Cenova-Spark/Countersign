<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0d10" />
    <title>Signet — remote countersignature</title>
    <meta name="description" content="Approve a pending Countersign request from your phone, with the same hold the device asks for." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- One family at two widths, plus the system monospace.
         · Saira Condensed — the silkscreen voice: legends printed on the
           instrument, and the headings that speak in the same register.
         · Saira — prose, for the sentences a person actually reads.
         · ui-monospace — anything that is *data*: statements, digests, ids.
           It matches the device screen glyph-for-glyph, which is what makes
           comparing a digest across the two screens meaningful rather than
           approximate (§6.1). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Saira:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
