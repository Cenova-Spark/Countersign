[package]
name = "countersign-db"
description = "The Countersign database domain pack: SQL statement classification, blast-radius estimation, and device render hints."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

# `cdylib` is for the WebAssembly build — `cargo build -p countersign-db
# --target wasm32-unknown-unknown` — which is how the marketplace distributes
# this pack. The module imports nothing, so it cannot reach a network or a
# filesystem however it is hosted. See `countersign_pack::wasm`.
[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "countersign-db"
path = "src/main.rs"

[dependencies]
countersign-pack = { path = "../countersign-pack", version = "0.1.0" }
countersign-sql = { path = "../countersign-sql", version = "0.1.0" }
serde_json = { workspace = true }
