[package]
name = "signetd"
description = "The Countersign daemon: owns the device, classifies environments, enforces policy, queues approvals, and writes the audit trail."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[[bin]]
name = "signetd"
path = "src/main.rs"

[dependencies]
countersign-audit = { path = "../countersign-audit", version = "0.1.0" }
countersign-pack = { path = "../countersign-pack", version = "0.1.0" }
countersign-verify = { path = "../countersign-verify", version = "0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = "0.9"
getrandom = "0.3"
p256 = { version = "0.14.0-rc.10", default-features = false, features = ["ecdsa", "alloc"] }
